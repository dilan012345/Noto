<!DOCTYPE html>
<html>
<head>
<style>

@font-face {
    font-family: "Dangrek";
    src: url("Dangrek-Regular.ttf") format("truetype");
}

html, body {
    height: 100%;
    margin: 0;
}

.top-left {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 60px;
    font-family: "Dangrek", sans-serif;

    border-bottom: 3px solid white;
    padding-bottom: 5px;

    z-index: 1;
}
}

body {
    background-color: #211e25;
}

body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 300px;
    background: linear-gradient(to top, #95D081, transparent);
}

</style>
</head>

<body>

<div class="top-left">
    noto.
</div>

</body>
</html>
