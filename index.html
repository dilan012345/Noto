<!DOCTYPE html>
<html>
<head>
<style>

@font-face {
    font-family: "Dangrek";
    src: url("Dangrek-Regular.ttf") format("truetype");
}

@font-face {
    font-family: "Coolvetica";
    src: url("Coolvetica.ttf") format("truetype");
}

html, body {
    margin: 0;
    background: #211e25;
    color: white;
}

body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 300px;
    background: linear-gradient(to top, #95D081, transparent);
    pointer-events: none;
}

.header-cover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 130px;

    background: #211e25;

    z-index: 5;
}

.top-left {
    position: fixed;
    top: 20px;
    left: 20px;
    font-family: "Dangrek";
    font-size: 60px;
    z-index: 100;
}

.line {
    position: fixed;
    top: 130px;
    left: 20px;
    right: 20px;
    height: 3px;
    background: white;
    z-index: 100;
}

.buttons {
    position: fixed;
    top: 30px;
    right: 30px;
    display: flex;
    gap: 20px;
    z-index: 100;
}

.buttons button {
    background: #151219;
    color: white;
    border: 3px solid #3a383d;
    border-radius: 100px;
    padding: 12px 25px;
    font-family: "Dangrek";
    font-size: 30px;
    cursor: pointer;
}


.content {
    margin-top: 70px;
    padding: 20px;
    position: relative;
    z-index: 1;
}

.description {
    white-space: pre-line;
    max-width: 1800px;
    font-family: "Coolvetica";
    font-size: 22px;
    line-height: 1.5;
}



.centre-title {
    margin-top: 10px;
    margin-bottom: 40px;
    text-align: center;
    font-family: "Dangrek";
    font-size: 60px;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
}

.card {
    width: 300px;
    height: 600px;

    background: #151219;

    border: 3px solid #3a383d;
    border-radius: 40px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Coolvetica";
    font-size: 30px;
}

</style>
</head>

<body>

<div class="top-left">
    noto.
</div>

<div class="line"></div>

<div class="buttons">
    <button>Github</button>
    <button>Download</button>
</div>
<div class="header-cover"></div>
<div class="content">

    <div class="description">
        <p>
            Noto. is a minimalist notes app made with Jetpack Compose using Kotlin.
            Check out the GitHub repository and create an issue to request features or report bugs.
        </p>
    </div>

    <div class="centre-title">
        Screenshots
    </div>

    <div class="cards">

        <div class="card">
            Screenshot 1
        </div>

        <div class="card">
            Screenshot 2
        </div>

        <div class="card">
            Screenshot 3
        </div>

    </div>

</div>

</body>
</html>
