<!DOCTYPE html>
<html>
<head>
<style>

@font-face {
    font-family: "Dangrek";
    src: url("Dangrek-Regular.ttf") format("truetype");
}

@font-face {
    font-family: "Coolvetica";
    src: url("Coolvetica.ttf") format("truetype");
}

html, body {
    height: 100%;
    margin: 0;
}
.button-text {
    color: white;
    font-size: 30px;
    font-family: "Coolvetica", sans-serif;
}
.paragraph{
    color: white;
    font-size: 20px;
    font-family: "Coolvetica", sans-serif;
}
.description {
    position: absolute;
    top: 170px;
    left: 20px;
}
.top-left {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 60px;
    font-family: "Dangrek", sans-serif;


    z-index: 1;
}


.line {
    position: absolute;
    top: 120px; /* move it up/down */
    left: 20px;
    right: 20px; /* leaves a small gap on both edges */
    height: 3px;
    background: white;
    z-index: 1;
}

body {
    background-color: #211e25;
}

body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 300px;
    background: linear-gradient(to top, #95D081, transparent);
}

.buttons {
    position: fixed;
    top: 30px;
    right: 30px;
    

    display: flex;
    gap: 20px;
    z-index: 2;
}

.buttons button {
    background: #151219;
    color: #ffffff;
    border: 3px solid #3a383d;
    padding: 12px 12px;
    font-size: 30px;
    font-family: "Dangrek", sans-serif;
    border-radius: 100px;
    cursor: pointer;
    z-index: 2;
}

.cards {
    display: flex;
    gap: 60px;
    overflow-x: auto;
    top: 150px;
    align-items: center
}

.card {
    min-width: 500px;
    height: 200px;
    background: #151219;
    color: white;
    border-radius: 50px;
    border: 3px solid #3a383d;
    padding: 20px;
    flex-shrink: 0;
    font-family: "Coolvetica", sans-serif;
}
</style>
</head>

<body>

<div class="top-left">
    noto.
</div>
<div class="line">
</div>

<div class = 'paragraph description'>
    <p>
        noto. is a minimalist notes app made with Jetpack Compose using Kotlin.
        Check out the Github repository and create an issue to request and features or report bugs
        
    </p>
</div>



<div class="buttons">
    <button> Github</button>
    <button> Download</button>
</div>


<div class="cards">
    <div class="card">
        Card 1
    </div>

    <div class="card">
        Card 2
    </div>

    
</div>
</body>
</html>
