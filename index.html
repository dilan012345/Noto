<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">


<title>noto.</title>

<style>

* {
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #92B86A, #211e25 45%);
    color: white;
    overflow-x: hidden;
}


header {
    text-align: center;
    padding: 100px 20px 70px;
}


.logo {
    font-size: 80px;
    font-weight: 800;
    letter-spacing: -4px;
    background: linear-gradient(90deg,#5ff5dd,#80aaff);
    -webkit-background-clip: text;
    color: transparent;
}


.subtitle {
    max-width: 650px;
    margin: 25px auto;
    font-size: 22px;
    color: #b7bec8;
    line-height: 1.5;
}


.buttons {
    margin-top: 40px;
}


.button {
    display: inline-block;
    padding: 16px 35px;
    border-radius: 50px;
    background: #B9FFA4;
    color: #07100f;
    font-weight: 700;
    text-decoration: none;
    transition: .3s;
}


.button:hover {
    transform: translateY(-4px);
}


section {
    padding: 70px 8%;
}


.title {
    font-size: 42px;
    margin-bottom: 40px;
}


.features {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 25px;
}


.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 25px;
    transition: .3s;
}





footer {
    text-align:center;
    padding:40px;
    color:#777;
}


</style>

</head>


<body>


<header>

<div class="logo">
noto.
</div>

<p class="subtitle">

Built with Jetpack Compose.
</p>


<div class="buttons">
<a class="button" href="#">
Download APK
</a>
</div>

</header>



<section>

<h2 class="title">
Features
</h2>





</section>




<section>

<h2 class="title">
Screenshots
</h2>


<div class="phones">

<img class="phone" src="images/home.png">

<img class="phone" src="images/note.png">

<img class="phone" src="images/settings.png">

</div>


</section>









<footer>
© 2026 Noto
</footer>


</body>
</html>
