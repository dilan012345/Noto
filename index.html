<!DOCTYPE html>
<html>
<head>
<style>

@font-face {
    font-family: "Dangrek";
    src: url("Dangrek-Regular.ttf") format("truetype");
}

@font-face {
    font-family: "Coolvetica";
    src: url("Coolvetica.ttf") format("truetype");
}

html, body {
    height: 100%;
    margin: 0;
    background-color: #211e25;
}

body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 300px;
    background: linear-gradient(to top, #95D081, transparent);
    z-index: -1;
}


/* Title */
.top-left {
    position: fixed;
    top: 20px;
    left: 20px;

    color: white;
    font-size: 60px;
    font-family: "Dangrek", sans-serif;

    z-index: 10;
}


/* Divider line */
.line {
    position: fixed;
    top: 120px;
    left: 20px;
    right: 20px;

    height: 3px;
    background: white;

    z-index: 10;
}


/* Top buttons */
.buttons {
    position: fixed;
    top: 30px;
    right: 30px;

    display: flex;
    gap: 20px;

    z-index: 10;
}

.buttons button {
    background: #151219;
    color: white;

    border: 3px solid #3a383d;
    padding: 12px 25px;

    font-size: 30px;
    font-family: "Dangrek", sans-serif;

    border-radius: 100px;
    cursor: pointer;
}


/* Text */
.paragraph {
    color: white;
    font-size: 20px;
    font-family: "Coolvetica", sans-serif;
}

.description {
    padding-top: 170px;
    padding-left: 20px;
}


/* Scroll content */
.content {
    padding-top: 350px;
    padding-bottom: 100px;
}


/* Cards */
.cards {
    display: flex;
    gap: 60px;

    justify-content: center;
    align-items: center;

    overflow-x: auto;
    padding: 20px;
}


.card {
    min-width: 500px;
    height: 200px;

    background: #151219;
    color: white;

    border-radius: 50px;
    border: 3px solid #3a383d;

    padding: 20px;

    flex-shrink: 0;

    font-family: "Coolvetica", sans-serif;
}

</style>
</head>

<body>

<div class="top-left">
    noto.
</div>

<div class="line"></div>


<div class="buttons">
    <button>Github</button>
    <button>Download</button>
</div>


<div class="content">

    <div class="paragraph description">
        <p>
            noto. is a minimalist notes app made with Jetpack Compose using Kotlin.
            Check out the Github repository and create an issue to request any features or report bugs.
        </p>
    </div>


    <div class="cards">

        <div class="card">
            Screenshot 1
        </div>

        <div class="card">
            Screenshot 2
        </div>

        <div class="card">
            Screenshot 3
        </div>

    </div>

</div>


</body>
</html>
